schema_version: task_variables.v1
task_id: tsc

variables:
  task_name: traffic signal control (TSC)

  general_prior: |
    The task is to produce effective state representations to train a good reinforcement learning model aiming at good phase control for an isolated intersection. 
    Basic encodings such as queue length, waiting time, and phase serve conditions are provided.
    There will be no pedestrians, and only vehicles should be considered. 
    Incoming flow is free flow.
    You are working together with peers to analyze specific factors of an isolated intersection to design a good signal plan.
