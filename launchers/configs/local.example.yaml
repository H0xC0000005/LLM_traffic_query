# Copy to local.yaml and pass --local launchers/configs/local.yaml.
# These machine-specific values override config variables; keep API credentials
# in the inherited shell environment rather than any launcher YAML.
variables:
  python_sumo: 'E:/anaconda3/envs/sumo/python.exe'
  python_energy: 'E:/anaconda3/envs/energy_pred/python.exe'
  python_llm: 'E:/anaconda3/envs/llm/python.exe'
  python_llmfe: 'E:/anaconda3/envs/llmfe/python.exe'
  sumo_home: 'E:/Sumo'

